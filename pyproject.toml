[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access-pricing"
version = "0.1.0"
description = "Dynamical model and figure-reproduction code for the access-pricing paper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["access_pricing"]
